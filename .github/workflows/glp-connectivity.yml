name: GLP read-only connectivity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout reviewed probe
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 1848f40ead0f8886e93b82ce2242a7a836c3e758
          persist-credentials: false
      - name: Read public manifest
        run: python3 integrations/glp/probe_manifest.py
